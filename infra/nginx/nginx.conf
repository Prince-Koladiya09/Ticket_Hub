worker_processes auto;

events {
  worker_connections 2048;
}

http {
  # Docker's embedded DNS. Using a variable in proxy_pass makes nginx re-resolve `api` regularly, so
  # replicas added with `--scale api=3` (or restarted with new IPs) are picked up and load-balanced
  # (round-robin across every A record Docker returns).
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # First line of defence against floods; the API applies finer per-user limits (Redis) behind it.
  limit_req_zone $binary_remote_addr zone=edge:10m rate=30r/s;
  limit_req_status 429;

  log_format main '$remote_addr "$request" $status $body_bytes_sent rt=$request_time upstream=$upstream_addr';
  access_log /dev/stdout main;

  server {
    listen 80;
    client_max_body_size 1m;

    set $api_upstream http://api:4000;
    set $web_upstream http://client:80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;

    # Prometheus scrapes the API containers directly; never expose it publicly.
    location = /metrics {
      return 404;
    }

    location /api/ {
      limit_req zone=edge burst=60 nodelay;
      proxy_pass $api_upstream;
    }

    # WebSocket upgrade. The app uses the websocket transport only, so requests don't need to hit the
    # same API instance (no sticky sessions); cross-instance fan-out goes through the Redis adapter.
    location /socket.io/ {
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      proxy_pass $web_upstream;
    }
  }
}
